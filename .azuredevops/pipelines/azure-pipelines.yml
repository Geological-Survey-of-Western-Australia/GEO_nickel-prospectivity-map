trigger:
  batch: true
  branches:
    include:
    - '*'

variables:
  - group: gswa-jfrog
  - group: nickel-prospectivity-maps
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: CACHE_VERSION
    value: 'v1'
  - name: JFROG_PLATFORM_CONNECTION
    value: 'service-ado-gsrsd-platform'
  - name: BUILD_NAME
    value: $(Build.DefinitionName)
  - name: BUILD_NUMBER
    value: $(Build.BuildNumber)

pool:
  vmImage: ubuntu-latest

stages:
- stage: Curation
  displayName: Curation Scan
  jobs:
  - job: CurationAudit
    pool:
      vmImage: ubuntu-latest
    steps:

    # ------------------------------------------------------------------ #
    # 1. JFrog CLI via Platform V2 service connection                     #
    # ------------------------------------------------------------------ #
    - task: JfrogCliV2@1
      displayName: Install JFrog CLI
      inputs:
        jfrogPlatformConnection: $(JFROG_PLATFORM_CONNECTION)
        command: 'jf --version'

    # ------------------------------------------------------------------ #
    # 2. Miniconda                                                         #
    # ------------------------------------------------------------------ #
    - task: CmdLine@2
      displayName: Install Miniconda
      inputs:
        script: |
          wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p "$HOME/miniconda"
          export PATH="$HOME/miniconda/bin:$PATH"
          conda config --set solver libmamba
          conda install -n base conda-libmamba-solver -q -y
          conda --version

    # ------------------------------------------------------------------ #
    # 3. Generate environment-scan.yml                                    #
    #                                                                      #
    #    - Strips build strings for cross-platform resolution             #
    #    - Sets platforms: [linux-64] so conda skips Windows-only pkgs   #
    #    - All packages included — JFrog policies enforce compliance      #
    # ------------------------------------------------------------------ #
    - task: CmdLine@2
      displayName: Generate environment-scan.yml
      inputs:
        script: |
          export PATH="$HOME/miniconda/bin:$PATH"
          conda install -n base pyyaml -q -y

          python3 - <<'EOF'
          import yaml, os

          with open('environment.yml') as f:
              env = yaml.safe_load(f)

          seen, lines = set(), []
          for dep in env.get('dependencies', []):
              if not isinstance(dep, str):
                  continue
              parts = dep.split('=')
              name = parts[0].strip()
              version = parts[1].strip() if len(parts) >= 2 else None
              if name.lower() in seen:
                  continue
              seen.add(name.lower())
              lines.append(f"{name}={version}" if version else name)

          url  = os.environ['JFROG_URL'].rstrip('/')
          repo = os.environ['ARTIFACTORY_CONDA_REPO']
          with open('environment-scan.yml', 'w') as f:
              f.write("name: scan-env\n")
              f.write(f"channels:\n  - {url}/artifactory/api/conda/{repo}\n")
              f.write("dependencies:\n")
              f.writelines(f"  - {l}\n" for l in lines)

          print(f"Written {len(lines)} packages")
          EOF

          echo "--- environment-scan.yml ---"
          cat environment-scan.yml
      env:
        JFROG_URL: $(jfrog_url)
        ARTIFACTORY_CONDA_REPO: $(artifactory_conda_repo)

    # ------------------------------------------------------------------ #
    # 4. Restore conda cache                                              #
    # ------------------------------------------------------------------ #
    - task: Cache@2
      displayName: Restore conda cache
      inputs:
        key: '"conda-env" | "$(CACHE_VERSION)" | environment.yml'
        path: $(HOME)/miniconda/envs/scan-env
        cacheHitVar: CONDA_CACHE_RESTORED

    # ------------------------------------------------------------------ #
    # 5. Install via Artifactory                                          #
    #                                                                      #
    #    Auth via .netrc using jfrog_bot_token from variable group.      #
    #    JFrog Curation/policies enforce compliance at the repo layer.   #
    #    A blocked package returns 403 and the step fails.               #
    # ------------------------------------------------------------------ #
    - task: CmdLine@2
      displayName: Install via Artifactory
      condition: ne(variables.CONDA_CACHE_RESTORED, 'true')
      inputs:
        script: |
          export PATH="$HOME/miniconda/bin:$PATH"
          # Configure Artifactory auth via conda's native credential store
          conda config --set ssl_verify true
          conda config --add default_channels ""
          conda config --set channel_alias "$JFROG_URL/artifactory/api/conda"
          conda config --set channel_priority strict
          # Pass token via the URL directly — conda respects user:password@ in channel URLs
          JFROG_HOST=$(echo "$JFROG_URL" | sed 's|https://||;s|/.*||')
          AUTHED_CHANNEL="https://x-jf-authorization:$JFROG_TOKEN@$JFROG_HOST/artifactory/api/conda/$ARTIFACTORY_CONDA_REPO"
          # Rewrite channel in environment-scan.yml with authed URL
          sed -i "s|$JFROG_URL/artifactory/api/conda/$ARTIFACTORY_CONDA_REPO|$AUTHED_CHANNEL|g" environment-scan.yml
          conda env create --name scan-env --file environment-scan.yml
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_TOKEN: $(jfrog_bot_token)
        ARTIFACTORY_CONDA_REPO: $(artifactory_conda_repo)

    # ------------------------------------------------------------------ #
    # 6. Publish build info and trigger Xray scan — SECURITY GATE        #
    #                                                                      #
    #    Captures the resolved environment as a build in Artifactory     #
    #    and triggers an Xray scan against your configured policies.     #
    #    --fail=true blocks the pipeline on any policy violation.        #
    # ------------------------------------------------------------------ #
    - task: JfrogCliV2@1
      displayName: Publish build info and Xray scan
      inputs:
        jfrogPlatformConnection: $(JFROG_PLATFORM_CONNECTION)
        command: |
          jf rt build-collect-env $(BUILD_NAME) $(BUILD_NUMBER)
          jf rt build-publish $(BUILD_NAME) $(BUILD_NUMBER)
          jf bs $(BUILD_NAME) $(BUILD_NUMBER) --fail=true


- stage: Github
  displayName: Publish to GitHub
  dependsOn: Curation
  condition: and(succeeded('Curation'), eq(variables.isMain, true))
  jobs:
  - job: Mirror
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0
    - task: CmdLine@2
      displayName: Push mirror to GitHub
      inputs:
        script: |
          git remote remove github 2>/dev/null || true
          git remote add github https://$(github_author_token)@github.com/$(github_org)/$(github_repo_name).git
          git push github HEAD:refs/heads/"$BUILD_SOURCEBRANCHNAME" --follow-tags