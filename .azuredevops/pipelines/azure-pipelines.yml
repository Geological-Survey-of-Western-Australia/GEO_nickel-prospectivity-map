trigger:
  batch: true
  branches:
    include:
    - '*'
variables:
- group: gswa-jfrog
- group: nickel-prospectivity-maps
- name: isMain
  value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
- name: isRC
  value: $[contains(variables['Build.SourceBranch'], 'releases/')]
- name: isCICD
  value: $[contains(variables['Build.SourceBranch'], 'cicd')]
pool:
  vmImage: ubuntu-latest
stages:
- stage: Xray
  displayName: Xray Scan
  jobs:
  - job: ScanEnvironment
    displayName: Scan environment.yml
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: CmdLine@2
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
      displayName: Install and Configure JFrog CLI
      inputs:
        script: |
          curl -fL https://install-cli.jfrog.io | sh
          jf config add jfrog-bot \
            --url="$JFROG_URL" \
            --access-token="$JFROG_ACCESS_TOKEN" \
            --interactive=false
    - task: CmdLine@2
      displayName: Show environment.yml
      inputs:
        script: |
          echo "Contents of environment.yml:"
          cat environment.yml
    - task: CmdLine@2
      displayName: Install Miniconda
      inputs:
        script: |
          wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p "$HOME/miniconda"
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH
          export PATH="$HOME/miniconda/bin:$PATH"
          conda config --set solver libmamba
          conda install -n base conda-libmamba-solver -q -y
          
    - task: CmdLine@2
      displayName: Download conda packages for scanning
      inputs:
        script: |
          export PATH="$HOME/miniconda/bin:$PATH"
          mkdir -p conda-pkgs

          # Download packages without installing
          # Uses the channels from environment-scan.yml
          conda install \
          --download-only \
          --prefix /tmp/scan-prefix \
          --channel defaults \
          --channel esri \
          --override-channels \
          --platform linux-64 \
          --yes \
          $(python3 -c "

          # Conda caches downloads in pkgs dir - collect them
          find "$HOME/miniconda/pkgs" -name "*.conda" -o -name "*.tar.bz2" \
            | xargs -I{} cp {} conda-pkgs/ 2>/dev/null || true

          echo "Downloaded $(ls conda-pkgs | wc -l) packages"
          ls conda-pkgs/
    - task: CmdLine@2
      displayName: Scan conda packages with Xray
      inputs:
        script: |
          # Scan the directory of actual conda artifacts
          # Xray understands .conda and .tar.bz2 package formats natively
          jf scan conda-pkgs/ \
            --format=json > xray.json

          jf scan conda-pkgs/ \
            --format=sarif > xray.sarif
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: xray.sarif
        artifactName: CodeAnalysisLogs
      displayName: Publish SARIF Results
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: xray.json
        artifactName: XrayJsonResults
      displayName: Publish JSON Results
    - task: CmdLine@2
      displayName: Debug Xray JSON structure
      inputs:
        script: |
          python3 - <<'EOF'
          import json, sys

          with open('xray.json') as f:
              raw = json.load(f)

          # Debug: show the top-level structure so we can see what Xray returns
          if isinstance(raw, list):
              print(f"Top level: list with {len(raw)} items")
              if raw:
                  print(f"First item keys: {list(raw[0].keys()) if isinstance(raw[0], dict) else type(raw[0])}")
                  print(json.dumps(raw[0], indent=2)[:2000])
          elif isinstance(raw, dict):
              print(f"Top level: dict with keys: {list(raw.keys())}")
              print(json.dumps(raw, indent=2)[:2000])
          EOF
- stage: Github
  displayName: 'Publish to GitHub'
  dependsOn:
  - Xray
  condition: and( succeeded('Xray'), eq(variables.isMain, true) )
  jobs:
  - job: Mirror
    displayName: 'Mirror to GitHub'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        fetchDepth: 0
    - task: CmdLine@2
      displayName: 'Push Mirror to GitHub'
      inputs:
        script: |
          echo "Configuring GitHub remote..."

          # Remove existing remote if present
          git remote remove github 2>/dev/null || true

          # Add GitHub remote using PAT from ADO Library
          git remote add github https://$(github_author_token)@github.com/$(github_org)/$(github_repo_name).git
          echo "Pushing current branch to GitHub..."
          git push github HEAD:refs/heads/"$BUILD_SOURCEBRANCHNAME" --follow-tags
