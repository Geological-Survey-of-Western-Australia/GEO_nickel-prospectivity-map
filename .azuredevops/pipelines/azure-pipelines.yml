trigger:
  batch: true
  branches:
    include:
    - '*'
variables:
- group: gswa-jfrog           # requires: jfrog_url, jfrog_bot_token, artifactory_conda_repo
- group: nickel-prospectivity-maps  # requires: github_author_token, github_org, github_repo_name
- name: isMain
  value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
- name: isRC
  value: $[contains(variables['Build.SourceBranch'], 'releases/')]
- name: isCICD
  value: $[contains(variables['Build.SourceBranch'], 'cicd')]

stages:
- stage: Xray
  displayName: Xray Scan
  jobs:
  - job: ScanEnvironment
    displayName: Scan environment.yml
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: CmdLine@2
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
      displayName: Install and Configure JFrog CLI
      inputs:
        script: |
          curl -fL https://install-cli.jfrog.io | sh
          jf config add jfrog-bot \
            --url="$JFROG_URL" \
            --access-token="$JFROG_ACCESS_TOKEN" \
            --interactive=false

    - task: CmdLine@2
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
        JFROG_CONDA_REPO: $(artifactory_conda_repo)
      displayName: Download real conda packages via repodata lookup
      inputs:
        script: |
          python3 -u - <<'PYEOF'
          # Fetches real package binaries so Xray has something to fingerprint
          # (Component Search's checksum-free identity lookup only finds data
          # for pypi:// coordinates, not conda:// -- see docs/xray-conda-coverage-proposal.md).
          #
          # Deliberately avoids `conda install`: conda has to fetch and parse
          # the full repodata.json for every proxied channel to do ANY install
          # operation, and that index parsing (not the dependency solve) is
          # what exhausted the hosted agent's memory previously. Since
          # environment.yml already pins every exact name+version, there's
          # nothing to resolve -- fetch each subdir's repodata.json directly
          # with plain Python (a dict lookup, not conda/libmamba's solver
          # machinery) to find the right filename, then download just the
          # ~254 needed files directly.
          import yaml, json, os, sys, time, urllib.request, urllib.error

          JFROG_URL = os.environ['JFROG_URL'].rstrip('/')
          TOKEN = os.environ['JFROG_ACCESS_TOKEN']
          CONDA_REPO = os.environ['JFROG_CONDA_REPO']
          SUBDIRS = ['noarch', 'linux-64', 'win-64']
          TIMEOUT = 300
          RETRIES = 4

          def get(path):
              last_exc = None
              for attempt in range(1, RETRIES + 1):
                  try:
                      req = urllib.request.Request(
                          f"{JFROG_URL}{path}",
                          headers={'Authorization': f'Bearer {TOKEN}'},
                      )
                      with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                          return resp.read()
                  except Exception as e:
                      last_exc = e
                      if attempt < RETRIES:
                          wait = 2 ** (attempt - 1)
                          print(f"    attempt {attempt}/{RETRIES} failed ({e}); retrying in {wait}s...")
                          time.sleep(wait)
              raise last_exc

          with open('environment.yml') as f:
              env = yaml.safe_load(f)

          packages = []
          seen = set()
          for dep in env.get('dependencies', []):
              if not isinstance(dep, str):
                  continue  # skip pip: sub-blocks
              parts = dep.split('=')
              name = parts[0]
              # Strip platform-specific build string: keep name=version only.
              version = parts[1] if len(parts) >= 2 and parts[1] else None
              if not version or name in seen:
                  continue
              seen.add(name)
              packages.append({'name': name, 'version': version})

          print(f"Parsed {len(packages)} unique versioned packages from environment.yml")

          # (name, version) -> (subdir, filename), built from each subdir's
          # repodata.json without conda's own solver/index machinery.
          lookup = {}
          for subdir in SUBDIRS:
              print(f"Fetching repodata.json for {subdir}...")
              try:
                  body = get(f"/artifactory/{CONDA_REPO}/{subdir}/repodata.json")
              except Exception as e:
                  print(f"  could not fetch {subdir}/repodata.json: {e}")
                  continue
              print(f"  {len(body) / 1_000_000:.1f} MB")
              data = json.loads(body)
              entries = {}
              entries.update(data.get('packages', {}))
              entries.update(data.get('packages.conda', {}))
              for filename, info in entries.items():
                  key = (info.get('name'), info.get('version'))
                  lookup.setdefault(key, (subdir, filename))
              print(f"  {len(entries)} entries indexed")

          os.makedirs('conda-pkgs', exist_ok=True)
          found = 0
          missing = []
          for p in packages:
              match = lookup.get((p['name'], p['version']))
              if not match:
                  missing.append(f"{p['name']}={p['version']}")
                  continue
              subdir, filename = match
              try:
                  body = get(f"/artifactory/{CONDA_REPO}/{subdir}/{filename}")
              except Exception as e:
                  print(f"  could not download {filename}: {e}")
                  missing.append(f"{p['name']}={p['version']}")
                  continue
              with open(os.path.join('conda-pkgs', filename), 'wb') as f:
                  f.write(body)
              found += 1

          print(f"Downloaded {found}/{len(packages)} packages to conda-pkgs/")
          if missing:
              shown = ', '.join(missing[:30])
              more = ' ...' if len(missing) > 30 else ''
              print(f"Not found in any subdir ({len(missing)}): {shown}{more}")
          PYEOF

    - task: CmdLine@2
      displayName: Scan downloaded packages with Xray
      inputs:
        script: |
          # --watches applies the gsrsd_watch policy (and its ignore rules/
          # exceptions) natively, so this only fails the build on violations
          # that aren't already excepted.
          set +e
          jf scan conda-pkgs/ \
            --server-id=jfrog-bot \
            --watches=gsrsd_watch \
            --format=sarif > xray.sarif
          sarif_rc=$?

          jf scan conda-pkgs/ \
            --server-id=jfrog-bot \
            --watches=gsrsd_watch \
            --format=json > xray.json
          json_rc=$?
          set -e

          if [ "$sarif_rc" -ne 0 ] || [ "$json_rc" -ne 0 ]; then
            echo "Xray reported violations against watch 'gsrsd_watch' not covered by an existing exception."
            exit 1
          fi

    - task: PublishPipelineArtifact@1
      displayName: Publish SARIF Results
      condition: always()
      inputs:
        targetPath: xray.sarif
        artifactName: CodeAnalysisLogs

    - task: PublishPipelineArtifact@1
      displayName: Publish JSON Results
      condition: always()
      inputs:
        targetPath: xray.json
        artifactName: XrayJsonResults

- stage: Github
  displayName: 'Publish to GitHub'
  dependsOn:
  - Xray
  condition: and( succeeded('Xray'), eq(variables.isMain, true) )
  jobs:
  - job: Mirror
    displayName: 'Mirror to GitHub'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        fetchDepth: 0
    - task: CmdLine@2
      displayName: 'Push Mirror to GitHub'
      inputs:
        script: |
          git remote remove github 2>/dev/null || true
          git remote add github https://$(github_author_token)@github.com/$(github_org)/$(github_repo_name).git
          git push github HEAD:refs/heads/"$BUILD_SOURCEBRANCHNAME" --follow-tags
