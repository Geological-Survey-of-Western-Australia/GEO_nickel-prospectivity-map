trigger:
  batch: true
  branches:
    include:
    - '*'
variables:
  - group: gswa-jfrog
  - group: nickel-prospectivity-maps
  # for releases
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  # for integration testing
  - name: isRC
    value: $[contains(variables['Build.SourceBranch'], 'releases/')]
  # for modifying/reviewing pipeline
  - name: isCICD 
    value: $[contains(variables['Build.SourceBranch'], 'cicd')]

pool:
  vmImage: ubuntu-latest

stages:
- stage: Curation
  displayName: Curation Scan
  jobs:
  - job: CurationAudit
    steps:
    - script: |
        curl -fL https://install-cli.jfrog.io | sh
        jf config add jfrog-bot \
          --url="$JFROG_URL" \
          --access-token="$JFROG_ACCESS_TOKEN" \
          --interactive=false
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
      displayName: Install and configure JFrog CLI

    - script: |
        jf curation-audit \
          --format=json > curation.json
      displayName: Run curation audit

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: curation.json
        artifactName: CurationResults
      displayName: Publish results


# see if requires tag
- stage: Github
  displayName: 'Publish to GitHub'
  dependsOn: 
    - Curation
  condition: and( 
    succeeded('Curation'), 
    eq(variables.isMain, true) )
  jobs:
    - job: Mirror
      displayName: 'Mirror to GitHub'
      pool:
        vmImage: 'ubuntu-latest'

      steps:
      - checkout: self
        fetchDepth: 0   # REQUIRED for full history & tags

      - script: |
          echo "Configuring GitHub remote..."

          # Remove existing remote if present
          git remote remove github 2>/dev/null || true

          # Add GitHub remote using PAT from ADO Library
          git remote add github https://$(github_author_token)@github.com/$(github_org)/$(github_repo_name).git
          echo "Pushing current branch to GitHub..."
          git push github HEAD:refs/heads/"$BUILD_SOURCEBRANCHNAME" --follow-tags
        displayName: 'Push Mirror to GitHub'