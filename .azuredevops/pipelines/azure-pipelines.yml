trigger:
  batch: true
  branches:
    include:
    - '*'
variables:
- group: gswa-jfrog           # requires: jfrog_url, jfrog_bot_token
- group: nickel-prospectivity-maps  # requires: github_author_token, github_org, github_repo_name
- name: isMain
  value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
- name: isRC
  value: $[contains(variables['Build.SourceBranch'], 'releases/')]
- name: isCICD
  value: $[contains(variables['Build.SourceBranch'], 'cicd')]

stages:
- stage: Xray
  displayName: Xray Scan
  jobs:
  - job: ScanEnvironment
    displayName: Scan environment.yml
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: CmdLine@2
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
      displayName: Query Xray Component Search for environment.yml packages
      inputs:
        script: |
          python3 - <<'PYEOF'
          import yaml, json, os, sys, urllib.request, urllib.error

          JFROG_URL = os.environ['JFROG_URL'].rstrip('/')
          TOKEN = os.environ['JFROG_ACCESS_TOKEN']
          WATCH_NAME = 'gsrsd_watch'
          # Approximation of gsrsd_watch's real policy thresholds — this is a
          # hand-maintained stand-in, not a live read of the policy itself, so
          # if the policy's severity/license rules change in the JFrog UI this
          # won't automatically follow. Revisit if that drifts.
          BLOCKING_SEVERITIES = {'Critical', 'High'}
          BATCH_SIZE = 100

          def api_call(path, method='GET', payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  f"{JFROG_URL}{path}",
                  data=data,
                  headers={
                      'Content-Type': 'application/json',
                      'Authorization': f'Bearer {TOKEN}',
                  },
                  method=method,
              )
              with urllib.request.urlopen(req) as resp:
                  body = resp.read()
                  return json.loads(body) if body else {}

          def ping(label, path):
              try:
                  req = urllib.request.Request(
                      f"{JFROG_URL}{path}",
                      headers={'Authorization': f'Bearer {TOKEN}'},
                  )
                  with urllib.request.urlopen(req) as resp:
                      print(f"  {label}: HTTP {resp.status} — {resp.read()[:200]}")
              except urllib.error.HTTPError as e:
                  print(f"  {label}: HTTP {e.code} — {e.read()[:200]}")
              except Exception as e:
                  print(f"  {label}: {type(e).__name__}: {e}")

          # --- 0. Sanity-check connectivity before trusting component/id ---
          # The component/id call below 404'd with a generic router-level
          # "page not found" rather than a JSON error — that's Xray's own
          # microservice never being reached, not an auth/data problem. These
          # two pings isolate whether it's Xray specifically (not provisioned,
          # or a moved endpoint) vs. JFROG_URL/auth being wrong in general.
          print("Connectivity checks:")
          ping("Artifactory ping", "/artifactory/api/system/ping")
          ping("Xray ping", "/xray/api/v1/system/ping")
          print()

          # --- 1. Parse environment.yml ------------------------------------
          with open('environment.yml') as f:
              env = yaml.safe_load(f)

          packages = []
          seen = set()
          for dep in env.get('dependencies', []):
              if not isinstance(dep, str):
                  continue  # skip pip: sub-blocks
              parts = dep.split('=')
              name = parts[0]
              # Strip platform-specific build string: keep name=version only.
              version = parts[1] if len(parts) >= 2 and parts[1] else None
              if not version or name in seen:
                  continue
              seen.add(name)
              packages.append({'name': name, 'version': version})

          print(f"Parsed {len(packages)} unique versioned packages from environment.yml")

          # --- 2. Query the Xray Component Summary API in batches -----------
          # Confirmed response shape (this instance):
          #   {"artifacts": [{"general": {"component_id": "name:version"},
          #                    "issues": [...], "licenses": [...], "operational_risks": [...]}]}
          # 'general.component_id' comes back scheme-stripped ("name:version")
          # regardless of what scheme prefix was sent.
          #
          # conda:// and generic:// both came back with issues: [] and a bogus
          # "Unknown" license for cryptography==48.0.0 — a real package with a
          # real license and CVE history. That's Xray not having a vulnerability
          # database indexed under those namespaces at all: CVEs/advisories are
          # catalogued against the actual publishing ecosystem (pypi, npm, ...),
          # not conda. Since most of environment.yml's packages are conda-
          # packaged mirrors of PyPI projects, run a second pass with pypi://
          # so those get a real shot at matching. conda:// is kept as the first
          # pass for anything genuinely conda/OS-only that pypi won't resolve.
          def query_schema(scheme):
              found = []
              for i in range(0, len(packages), BATCH_SIZE):
                  batch = packages[i:i + BATCH_SIZE]
                  payload = {
                      'component_details': [
                          {'component_id': f"{scheme}://{p['name']}:{p['version']}"}
                          for p in batch
                      ]
                  }
                  print(f"  [{scheme}] querying packages {i + 1}-{i + len(batch)} of {len(packages)}...")
                  try:
                      result = api_call('/xray/api/v1/summary/component', method='POST', payload=payload)
                  except urllib.error.HTTPError as e:
                      print(f"    HTTP {e.code}: {e.read().decode(errors='replace')[:300]}")
                      continue
                  artifacts = result.get('artifacts', []) if isinstance(result, dict) else []
                  if i == 0:
                      print(f"    Raw response (first batch, truncated): {json.dumps(result)[:1000]}")
                  found.extend(artifacts)
              return found

          print("Component-ID format probe (Jinja2 3.0.3 is affected by CVE-2024-22195 — a good canary):")
          probe_pkg = next((p for p in packages if p['name'] == 'jinja2'), packages[0])
          for scheme in ('conda', 'pypi', 'generic'):
              cid = f"{scheme}://{probe_pkg['name']}:{probe_pkg['version']}"
              try:
                  r = api_call('/xray/api/v1/summary/component', method='POST',
                               payload={'component_details': [{'component_id': cid}]})
                  print(f"  [{scheme}] {cid} -> {json.dumps(r)[:600]}")
              except urllib.error.HTTPError as e:
                  print(f"  [{scheme}] {cid} -> HTTP {e.code}: {e.read().decode(errors='replace')[:300]}")
          print()

          print("Querying Xray (conda:// pass):")
          components_data = query_schema('conda')
          print("Querying Xray (pypi:// pass):")
          components_data += query_schema('pypi')

          print(f"Xray returned data for {len(components_data)} component lookups")

          # --- 3. Fetch ignore rules for gsrsd_watch ------------------------
          # NOTE: endpoint/schema unverified against this Xray instance —
          # raw_ignore_rules in xray-results.json shows the real shape if the
          # field names guessed below (watches/watch_names, vulnerabilities/cves)
          # turn out to be wrong.
          try:
              ignore_rules_raw = api_call('/xray/api/v1/ignore_rules')
              print(f"Raw ignore_rules response (truncated): {json.dumps(ignore_rules_raw)[:1000]}")
          except urllib.error.HTTPError as e:
              print(f"Could not fetch ignore rules (HTTP {e.code}): {e.read().decode(errors='replace')[:300]}")
              ignore_rules_raw = {}

          if isinstance(ignore_rules_raw, dict):
              ignore_rules = ignore_rules_raw.get('data', [])
          else:
              ignore_rules = ignore_rules_raw or []
          if not isinstance(ignore_rules, list):
              ignore_rules = []

          def rule_applies_to_watch(rule):
              watches = rule.get('watches') or rule.get('watch_names') or []
              return not watches or WATCH_NAME in watches

          def rule_cves(rule):
              vulns = rule.get('vulnerabilities') or rule.get('cves') or []
              out = set()
              for v in vulns:
                  out.add(v if isinstance(v, str) else (v.get('cve') or v.get('id')))
              return {v for v in out if v}

          ignored_cves = set()
          for rule in ignore_rules:
              if rule.get('is_expired'):
                  continue
              if not rule_applies_to_watch(rule):
                  continue
              ignored_cves |= rule_cves(rule)

          print(f"Loaded {len(ignored_cves)} actively-ignored CVE(s) for watch '{WATCH_NAME}'")

          # --- 4. Filter exceptions, apply severity threshold ---------------
          # 'issues' entries' exact field names are still unconfirmed (every
          # probe so far returned issues: [] to test against) — extraction
          # below tries the plausible variants defensively. raw_components in
          # xray-results.json has the real shape once something actually hits.
          def issue_cve(issue):
              cves = issue.get('cves') or []
              for c in cves:
                  cve = c.get('cve') if isinstance(c, dict) else c
                  if cve:
                      return cve
              return issue.get('cve')

          violations = []
          seen_violations = set()
          for component in components_data:
              component_id = component.get('general', {}).get('component_id')
              for issue in component.get('issues', []):
                  cve = issue_cve(issue)
                  severity = issue.get('severity', 'Unknown')
                  identifier = cve or issue.get('issue_id') or issue.get('summary')
                  if cve and cve in ignored_cves:
                      continue
                  if severity not in BLOCKING_SEVERITIES:
                      continue
                  key = (component_id, identifier)
                  if key in seen_violations:
                      continue
                  seen_violations.add(key)
                  violations.append({
                      'component': component_id,
                      'cve': cve,
                      'issue_id': issue.get('issue_id'),
                      'severity': severity,
                      'summary': issue.get('summary'),
                  })

          with open('xray-results.json', 'w') as f:
              json.dump({
                  'packages_checked': len(packages),
                  'components_returned': len(components_data),
                  'ignored_cve_count': len(ignored_cves),
                  'violations': violations,
                  'raw_components': components_data,
                  'raw_ignore_rules': ignore_rules,
              }, f, indent=2)

          print(f"\n{'='*60}")
          print(f" XRAY REPORT (watch: {WATCH_NAME}, blocking severities: {sorted(BLOCKING_SEVERITIES)})")
          print(f"{'='*60}")
          print(f"  Packages checked : {len(packages)}")
          print(f"  Ignored CVEs     : {len(ignored_cves)}")
          print(f"  Violations       : {len(violations)}")
          if violations:
              print()
              for v in violations:
                  print(f"  x {v['component']}  {v['cve'] or v['issue_id'] or '(no id)'}  [{v['severity']}]")
                  if v['summary']:
                      print(f"    {v['summary'][:200]}")
          print(f"{'='*60}\n")

          if violations:
              sys.exit(1)
          PYEOF

    - task: PublishPipelineArtifact@1
      displayName: Publish Xray Results
      condition: always()
      inputs:
        targetPath: xray-results.json
        artifactName: XrayResults

- stage: Github
  displayName: 'Publish to GitHub'
  dependsOn:
  - Xray
  condition: and( succeeded('Xray'), eq(variables.isMain, true) )
  jobs:
  - job: Mirror
    displayName: 'Mirror to GitHub'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        fetchDepth: 0
    - task: CmdLine@2
      displayName: 'Push Mirror to GitHub'
      inputs:
        script: |
          git remote remove github 2>/dev/null || true
          git remote add github https://$(github_author_token)@github.com/$(github_org)/$(github_repo_name).git
          git push github HEAD:refs/heads/"$BUILD_SOURCEBRANCHNAME" --follow-tags
