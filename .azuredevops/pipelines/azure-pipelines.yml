trigger:
  batch: true
  branches:
    include:
    - '*'

variables:
  - group: gswa-jfrog
  - group: nickel-prospectivity-maps
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: isRC
    value: $[contains(variables['Build.SourceBranch'], 'releases/')]
  - name: isCICD
    value: $[contains(variables['Build.SourceBranch'], 'cicd')]
  - name: MAMBA_ROOT_PREFIX
    value: $(Agent.TempDirectory)/micromamba

pool:
  vmImage: windows-latest

stages:
- stage: Curation
  displayName: Curation Scan
  jobs:
  - job: CurationAudit
    displayName: Curate environment.yml via Artifactory
    pool:
      vmImage: windows-latest

    steps:

    # ------------------------------------------------------------------ #
    # 1. JFrog CLI                                                         #
    # ------------------------------------------------------------------ #
    - powershell: |
        $jfDest = "$env:AGENT_TOOLSDIRECTORY\jf.exe"
        Invoke-WebRequest `
          -Uri "https://releases.jfrog.io/artifactory/jfrog-cli/v2-jf/[RELEASE]/jfrog-cli-windows-amd64/jf.exe" `
          -OutFile $jfDest
        echo "##vso[task.prependpath]$env:AGENT_TOOLSDIRECTORY"
        & $jfDest config add jfrog-bot `
          --url="$env:JFROG_URL" `
          --access-token="$env:JFROG_ACCESS_TOKEN" `
          --interactive=false
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
      displayName: Install and configure JFrog CLI

    # ------------------------------------------------------------------ #
    # 2. micromamba                                                        #
    # ------------------------------------------------------------------ #
    - powershell: |
        $dest = "$env:AGENT_TEMPDIRECTORY\micromamba"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null

        Invoke-WebRequest `
          -Uri "https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-win-64" `
          -OutFile "$dest\micromamba.exe"

        echo "##vso[task.prependpath]$dest"
        & "$dest\micromamba.exe" --version
      displayName: Install micromamba

    # ------------------------------------------------------------------ #
    # 3. Write .netrc — micromamba reads %USERPROFILE%\.netrc on Windows. #
    # ------------------------------------------------------------------ #
    - powershell: |
        $jfrogHost = ($env:JFROG_URL -replace "https://","" -split "/")[0]
        $netrcPath  = "$env:USERPROFILE\.netrc"
        Add-Content -Path $netrcPath -Value "machine $jfrogHost"
        Add-Content -Path $netrcPath -Value "login x-jf-authorization"
        Add-Content -Path $netrcPath -Value "password $env:JFROG_TOKEN"
        Write-Host "netrc entry written for $jfrogHost"
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_TOKEN: $(jfrog_bot_token)
      displayName: Write .netrc for Artifactory auth

    # ------------------------------------------------------------------ #
    # 4. Strip build strings + Windows/ESRI-only packages                 #
    # ------------------------------------------------------------------ #
    - powershell: |
        $script = @'
        import yaml, sys, os

        WINDOWS_ONLY = {
          'vc', 'vs2015_runtime', 'win_inet_pton', 'wincertstore',
          'winkerberos', 'winpty', 'pywin32-ctypes', 'pywin32-security',
          'pywinpty', 'requests-negotiate-sspi', 'icc_rt', 'x86cpu',
          'python-certifi-win32', 'python_abi',
        }
        ESRI_ONLY = {
          'arcgis', 'arcgispro', 'arcpy', 'arcpy-base',
          'pro_notebook_integration', 'despatch',
        }
        SKIP = WINDOWS_ONLY | ESRI_ONLY

        with open('environment.yml') as f:
            env = yaml.safe_load(f)

        lines = []
        seen = set()
        for dep in env.get('dependencies', []):
            if not isinstance(dep, str):
                continue
            parts = dep.split('=')
            name = parts[0].strip()
            version = parts[1].strip() if len(parts) >= 2 else None
            name_lower = name.lower()

            if name_lower in SKIP or name_lower in seen:
                continue
            seen.add(name_lower)

            lines.append(f"{name}={version}" if version else name)

        jfrog_url  = os.environ['JFROG_URL'].rstrip('/')
        conda_repo = os.environ['ARTIFACTORY_CONDA_REPO']
        channel = f"{jfrog_url}/artifactory/api/conda/{conda_repo}"

        with open('environment-scan.yml', 'w') as f:
            f.write("name: scan-env\n")
            f.write("channels:\n")
            f.write(f"  - {channel}\n")
            f.write("dependencies:\n")
            for line in lines:
                f.write(f"  - {line}\n")

        print(f"Generated environment-scan.yml with {len(lines)} packages")
        print(f"Channel: {channel}")
        '@
        $script | Out-File -FilePath "$env:AGENT_TEMPDIRECTORY\gen_scan_env.py" -Encoding utf8
        python "$env:AGENT_TEMPDIRECTORY\gen_scan_env.py"

        Write-Host "--- environment-scan.yml ---"
        Get-Content environment-scan.yml
      env:
        JFROG_URL: $(jfrog_url)
        ARTIFACTORY_CONDA_REPO: $(artifactory_conda_repo)
      displayName: Strip build strings, rewrite channels to Artifactory

    # ------------------------------------------------------------------ #
    # 5. Install via Artifactory — Curation enforces policy inline        #
    # ------------------------------------------------------------------ #
    - powershell: |
        micromamba create `
          --name scan-env `
          --file environment-scan.yml `
          --override-channels `
          --yes
      displayName: Install via Artifactory (Curation enforces policy)

    # ------------------------------------------------------------------ #
    # 6. Curation audit report — runs even if step 5 failed              #
    # ------------------------------------------------------------------ #
    - powershell: |
        jf curation-audit --format=json 2>&1 | Tee-Object -FilePath curation.json

        $script = @'
        import json, sys

        try:
            with open('curation.json') as f:
                raw = f.read().strip()
            results = json.loads(raw) if raw.startswith('[') else [json.loads(raw)]
        except Exception as e:
            print(f"Could not parse curation.json: {e}")
            sys.exit(0)

        blocked = []
        allowed = 0
        for entry in results:
            for pkg in entry.get('blocked', []):
                blocked.append(pkg)
            allowed += len(entry.get('approved', []))

        print(f"\n{'='*60}")
        print(f" CURATION REPORT")
        print(f"{'='*60}")
        print(f"  Approved : {allowed}")
        print(f"  Blocked  : {len(blocked)}")
        if blocked:
            print()
            for pkg in blocked:
                print(f"  x {pkg.get('name','?')}=={pkg.get('version','?')}")
                print(f"    Policy    : {pkg.get('policy_name','N/A')}")
                print(f"    Condition : {pkg.get('condition_name','N/A')}")
                print(f"    Reason    : {pkg.get('explanation','N/A')}")
                print()
        print(f"{'='*60}\n")
        '@
        $script | Out-File -FilePath "$env:AGENT_TEMPDIRECTORY\parse_curation.py" -Encoding utf8
        python "$env:AGENT_TEMPDIRECTORY\parse_curation.py"
      displayName: Publish curation audit report
      condition: always()

    # ------------------------------------------------------------------ #
    # 7. Publish artefact                                                  #
    # ------------------------------------------------------------------ #
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: curation.json
        artifactName: CurationResults
      displayName: Publish curation JSON
      condition: always()


# ------------------------------------------------------------------ #
# GitHub mirror — unchanged                                           #
# ------------------------------------------------------------------ #
- stage: Github
  displayName: Publish to GitHub
  dependsOn:
    - Curation
  condition: and(
    succeeded('Curation'),
    eq(variables.isMain, true) )
  jobs:
    - job: Mirror
      displayName: Mirror to GitHub
      pool:
        vmImage: windows-latest

      steps:
      - checkout: self
        fetchDepth: 0

      - powershell: |
          git remote remove github 2>$null
          git remote add github "https://$($env:GITHUB_AUTHOR_TOKEN)@github.com/$($env:GITHUB_ORG)/$($env:GITHUB_REPO_NAME).git"
          git push github "HEAD:refs/heads/$($env:BUILD_SOURCEBRANCHNAME)" --follow-tags
        env:
          GITHUB_AUTHOR_TOKEN: $(github_author_token)
          GITHUB_ORG: $(github_org)
          GITHUB_REPO_NAME: $(github_repo_name)
        displayName: Push mirror to GitHub