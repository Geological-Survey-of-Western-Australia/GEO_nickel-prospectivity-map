trigger:
  batch: true
  branches:
    include:
    - '*'

variables:
  - group: gswa-jfrog
  - group: nickel-prospectivity-maps
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: isRC
    value: $[contains(variables['Build.SourceBranch'], 'releases/')]
  - name: isCICD
    value: $[contains(variables['Build.SourceBranch'], 'cicd')]
  - name: MAMBA_ROOT_PREFIX
    value: $(Agent.TempDirectory)/micromamba
  # Cache key: changes only when environment.yml content changes.
  # Increment CACHE_VERSION manually to force a full cache bust
  # (e.g. after a JFrog policy change you want to re-validate).
  - name: CACHE_VERSION
    value: 'v1'
  # Required in gswa-jfrog variable group:
  #   jfrog_url              e.g. https://waresources.jfrog.io
  #   jfrog_bot_token        Artifactory access token (secret)
  #   artifactory_conda_repo e.g. conda-virtual  (repo name only, no path)

pool:
  vmImage: ubuntu-latest

stages:
# ====================================================================== #
# STAGE 1 — Curation                                                      #
# ====================================================================== #
- stage: Curation
  displayName: Curation Scan
  jobs:
  - job: CurationAudit
    displayName: Curate environment.yml via Artifactory
    pool:
      vmImage: ubuntu-latest

    steps:

    # ------------------------------------------------------------------ #
    # 1. JFrog CLI                                                         #
    # ------------------------------------------------------------------ #
    - script: |
        curl -fL https://install-cli.jfrog.io | sh
        jf config add jfrog-bot \
          --url="$JFROG_URL" \
          --access-token="$JFROG_ACCESS_TOKEN" \
          --interactive=false
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
      displayName: Install and configure JFrog CLI

    # ------------------------------------------------------------------ #
    # 2. micromamba                                                        #
    # ------------------------------------------------------------------ #
    - script: |
        curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
          | tar -xvj bin/micromamba
        export PATH="$(pwd)/bin:$PATH"
        echo "##vso[task.prependpath]$(pwd)/bin"
        micromamba --version
      displayName: Install micromamba

    # ------------------------------------------------------------------ #
    # 3. Write .netrc for Artifactory auth                                 #
    # ------------------------------------------------------------------ #
    - script: |
        JFROG_HOST=$(echo "$JFROG_URL" | sed 's|https://||' | sed 's|/.*||')
        cat >> ~/.netrc << EOF
        machine $JFROG_HOST
        login x-jf-authorization
        password $JFROG_TOKEN
        EOF
        chmod 600 ~/.netrc
        echo "netrc entry written for $JFROG_HOST"
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_TOKEN: $(jfrog_bot_token)
      displayName: Write .netrc for Artifactory auth

    # ------------------------------------------------------------------ #
    # 4. Strip build strings + Windows/ESRI-only packages                 #
    # ------------------------------------------------------------------ #
    - script: |
        python3 - <<'EOF'
        import yaml, sys, os

        WINDOWS_ONLY = {
          'vc', 'vs2015_runtime', 'win_inet_pton', 'wincertstore',
          'winkerberos', 'winpty', 'pywin32-ctypes', 'pywin32-security',
          'pywinpty', 'requests-negotiate-sspi', 'icc_rt', 'x86cpu',
          'python-certifi-win32', 'python_abi',
        }
        ESRI_ONLY = {
          'arcgis', 'arcgispro', 'arcpy', 'arcpy-base',
          'pro_notebook_integration', 'despatch',
        }
        SKIP = WINDOWS_ONLY | ESRI_ONLY

        with open('environment.yml') as f:
            env = yaml.safe_load(f)

        lines = []
        seen = set()
        for dep in env.get('dependencies', []):
            if not isinstance(dep, str):
                continue
            parts = dep.split('=')
            name = parts[0].strip()
            version = parts[1].strip() if len(parts) >= 2 else None
            name_lower = name.lower()

            if name_lower in SKIP or name_lower in seen:
                continue
            seen.add(name_lower)

            lines.append(f"{name}={version}" if version else name)

        jfrog_url  = os.environ['JFROG_URL'].rstrip('/')
        conda_repo = os.environ['ARTIFACTORY_CONDA_REPO']
        channel = f"{jfrog_url}/artifactory/api/conda/{conda_repo}"

        with open('environment-scan.yml', 'w') as f:
            f.write("name: scan-env\n")
            f.write("channels:\n")
            f.write(f"  - {channel}\n")
            f.write("dependencies:\n")
            for line in lines:
                f.write(f"  - {line}\n")

        print(f"Generated environment-scan.yml with {len(lines)} packages")
        print(f"Channel: {channel}")
        EOF

        echo "--- environment-scan.yml ---"
        cat environment-scan.yml
      env:
        JFROG_URL: $(jfrog_url)
        ARTIFACTORY_CONDA_REPO: $(artifactory_conda_repo)
      displayName: Strip build strings, rewrite channels to Artifactory

    # ------------------------------------------------------------------ #
    # 5. Curation audit — PRIMARY SECURITY GATE                           #
    #                                                                      #
    #    Runs BEFORE any install. Checks every package in                  #
    #    environment-scan.yml against your Curation policies in JFrog      #
    #    without downloading a single file.                                #
    #                                                                      #
    #    Collects ALL blocked packages before failing — does not stop at   #
    #    the first violation. The full list is printed at the end to       #
    #    support downstream admin triage and remediation tasks.            #
    # ------------------------------------------------------------------ #
    - script: |
        jf curation-audit \
          --format=json \
          2>&1 | tee curation.json

        python3 - <<'EOF'
        import json, sys

        try:
            with open('curation.json') as f:
                raw = f.read().strip()
            results = json.loads(raw) if raw.startswith('[') else [json.loads(raw)]
        except Exception as e:
            print(f"Could not parse curation.json: {e}")
            sys.exit(0)

        blocked = []
        approved = []
        for entry in results:
            for pkg in entry.get('blocked', []):
                blocked.append(pkg)
            for pkg in entry.get('approved', []):
                approved.append(pkg)

        print(f"\n{'='*60}")
        print(f" CURATION REPORT")
        print(f"{'='*60}")
        print(f"  Approved : {len(approved)}")
        print(f"  Blocked  : {len(blocked)}")

        if approved:
            print(f"\n  APPROVED PACKAGES ({len(approved)})")
            print(f"  {'-'*40}")
            for pkg in sorted(approved, key=lambda p: p.get('name', '').lower()):
                print(f"  + {pkg.get('name','?')}=={pkg.get('version','?')}")

        if blocked:
            print(f"\n  BLOCKED PACKAGES ({len(blocked)}) — action required")
            print(f"  {'-'*40}")
            for pkg in sorted(blocked, key=lambda p: p.get('name', '').lower()):
                print(f"  x {pkg.get('name','?')}=={pkg.get('version','?')}")
                print(f"    Policy    : {pkg.get('policy_name','N/A')}")
                print(f"    Condition : {pkg.get('condition_name','N/A')}")
                print(f"    Reason    : {pkg.get('explanation','N/A')}")
                print()

        print(f"{'='*60}\n")

        # Exit after printing the full report — never on first violation
        if blocked:
            print(f"Pipeline blocked: {len(blocked)} package(s) failed curation policy.")
            print("Resolve all items listed above before re-running.")
            sys.exit(1)

        print("All packages approved — proceeding to install.")
        EOF
      displayName: "Curation audit (security gate — full report before fail)"

    # ------------------------------------------------------------------ #
    # 6. Restore cached conda environment                                  #
    #                                                                      #
    #    Cache key = CACHE_VERSION + hash of environment.yml.             #
    #    A hit skips the entire micromamba install (step 7).              #
    #    A miss (env.yml changed, or CACHE_VERSION bumped) runs step 7    #
    #    and saves the new environment at step 8.                         #
    #                                                                      #
    #    Default Azure DevOps cache quota: 10 GB per pipeline.            #
    #    Bump CACHE_VERSION at the top of this file to force a full bust. #
    # ------------------------------------------------------------------ #
    - task: Cache@2
      inputs:
        key: '"conda-env" | "$(CACHE_VERSION)" | environment.yml'
        path: $(MAMBA_ROOT_PREFIX)/envs/scan-env
        cacheHitVar: CONDA_CACHE_RESTORED
      displayName: Restore conda environment cache

    # ------------------------------------------------------------------ #
    # 7. Install via Artifactory — only runs on cache miss                 #
    #                                                                      #
    #    By the time we reach this step, curation-audit (step 5) has      #
    #    already confirmed all packages are policy-compliant. This step    #
    #    is now purely about materialising the environment, not enforcing  #
    #    security — that gate has already been passed.                     #
    # ------------------------------------------------------------------ #
    - script: |
        micromamba create \
          --name scan-env \
          --file environment-scan.yml \
          --override-channels \
          --yes
      displayName: Install via Artifactory (runs only on cache miss)
      condition: ne(variables.CONDA_CACHE_RESTORED, 'true')

    # ------------------------------------------------------------------ #
    # 8. Publish artefacts — always runs                                   #
    # ------------------------------------------------------------------ #
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: curation.json
        artifactName: CurationResults
      displayName: Publish curation JSON
      condition: always()


# ====================================================================== #
# STAGE 2 — GitHub mirror (unchanged)                                     #
# ====================================================================== #
- stage: Github
  displayName: Publish to GitHub
  dependsOn:
    - Curation
  condition: and(
    succeeded('Curation'),
    eq(variables.isMain, true) )
  jobs:
    - job: Mirror
      displayName: Mirror to GitHub
      pool:
        vmImage: ubuntu-latest

      steps:
      - checkout: self
        fetchDepth: 0

      - script: |
          git remote remove github 2>/dev/null || true
          git remote add github https://$(github_author_token)@github.com/$(github_org)/$(github_repo_name).git
          git push github HEAD:refs/heads/"$BUILD_SOURCEBRANCHNAME" --follow-tags
        displayName: Push mirror to GitHub
