trigger:
  batch: true
  branches:
    include:
    - '*'

variables:
  - group: gswa-jfrog
  - group: nickel-prospectivity-maps
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: isRC
    value: $[contains(variables['Build.SourceBranch'], 'releases/')]
  - name: isCICD
    value: $[contains(variables['Build.SourceBranch'], 'cicd')]
  - name: MAMBA_ROOT_PREFIX
    value: $(Agent.TempDirectory)/micromamba
  # Your Artifactory virtual conda repo that has Curation enabled.
  # Set this in the gswa-jfrog variable group alongside jfrog_url.
  # e.g. https://yourorg.jfrog.io/artifactory/api/conda/conda-virtual
  - name: ARTIFACTORY_CONDA_URL
    value: $(artifactory_conda_url)

pool:
  vmImage: ubuntu-latest

stages:
- stage: Curation
  displayName: Curation Scan
  jobs:
  - job: CurationAudit
    displayName: Curate environment.yml via Artifactory
    pool:
      vmImage: ubuntu-latest

    steps:

    # ------------------------------------------------------------------ #
    # 1. JFrog CLI                                                         #
    # ------------------------------------------------------------------ #
    - script: |
        curl -fL https://install-cli.jfrog.io | sh
        jf config add jfrog-bot \
          --url="$JFROG_URL" \
          --access-token="$JFROG_ACCESS_TOKEN" \
          --interactive=false
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
      displayName: Install and configure JFrog CLI

    # ------------------------------------------------------------------ #
    # 2. micromamba                                                        #
    # ------------------------------------------------------------------ #
    - script: |
        curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
          | tar -xvj bin/micromamba
        # prependpath takes effect in subsequent steps only, so use the
        # explicit path here and export for the remainder of this step
        export PATH="$(pwd)/bin:$PATH"
        echo "##vso[task.prependpath]$(pwd)/bin"
        micromamba --version
      displayName: Install micromamba

    # ------------------------------------------------------------------ #
    # 3. Strip build strings + Windows/ESRI-only packages                 #
    #    Also rewrites channels to point at Artifactory so that           #
    #    every package request flows through Curation.                    #
    # ------------------------------------------------------------------ #
    - script: |
        python3 - <<'EOF'
        import yaml, sys, os

        WINDOWS_ONLY = {
          'vc', 'vs2015_runtime', 'win_inet_pton', 'wincertstore',
          'winkerberos', 'winpty', 'pywin32-ctypes', 'pywin32-security',
          'pywinpty', 'requests-negotiate-sspi', 'icc_rt', 'x86cpu',
          'python-certifi-win32', 'python_abi',
        }
        ESRI_ONLY = {
          'arcgis', 'arcgispro', 'arcpy', 'arcpy-base',
          'pro_notebook_integration', 'despatch',
        }
        SKIP = WINDOWS_ONLY | ESRI_ONLY

        with open('environment.yml') as f:
            env = yaml.safe_load(f)

        lines = []
        seen = set()
        for dep in env.get('dependencies', []):
            if not isinstance(dep, str):
                continue
            parts = dep.split('=')
            name = parts[0].strip()
            version = parts[1].strip() if len(parts) >= 2 else None
            name_lower = name.lower()

            if name_lower in SKIP or name_lower in seen:
                continue
            seen.add(name_lower)

            lines.append(f"{name}={version}" if version else name)

        # Replace channels with the single Artifactory virtual repo.
        # Curation enforces policy on every request that flows through it;
        # --override-channels ensures nothing sneaks past to the public internet.
        artifactory_url = os.environ['ARTIFACTORY_CONDA_URL']

        with open('environment-scan.yml', 'w') as f:
            f.write("name: scan-env\n")
            f.write("channels:\n")
            f.write(f"  - {artifactory_url}\n")
            f.write("dependencies:\n")
            for line in lines:
                f.write(f"  - {line}\n")

        print(f"Generated environment-scan.yml with {len(lines)} packages")
        print(f"Channel: {artifactory_url}")
        EOF

        echo "--- environment-scan.yml ---"
        cat environment-scan.yml
      env:
        ARTIFACTORY_CONDA_URL: $(ARTIFACTORY_CONDA_URL)
      displayName: Strip build strings, rewrite channels to Artifactory

    # ------------------------------------------------------------------ #
    # 4. Configure micromamba auth for Artifactory                        #
    #    Curation requires authenticated requests to evaluate packages    #
    #    against your org's policies.                                     #
    # ------------------------------------------------------------------ #
    - script: |
        micromamba auth login \
          --host "$(jfrog_url)" \
          --token "$(jfrog_bot_token)"
      displayName: Authenticate micromamba with Artifactory

    # ------------------------------------------------------------------ #
    # 5. Install via Artifactory — Curation enforces policy inline        #
    #                                                                     #
    #    Any package that violates your Curation policy is blocked at     #
    #    download time. The install fails immediately with a clear error  #
    #    message identifying the blocked package and violated policy.     #
    #    No packages need to be on disk first — enforcement happens at    #
    #    the proxy layer in Artifactory before bytes are transferred.     #
    # ------------------------------------------------------------------ #
    - script: |
        micromamba create \
          --name scan-env \
          --file environment-scan.yml \
          --override-channels \
          --yes
      displayName: Install via Artifactory (Curation enforces policy)

    # ------------------------------------------------------------------ #
    # 6. Curation audit report                                            #
    #                                                                     #
    #    jf curation-audit queries the Artifactory audit log for this     #
    #    run and produces a structured report of blocked / allowed        #
    #    packages. This is the compliance artefact — it does NOT re-scan  #
    #    or re-enforce; enforcement already happened in step 5.           #
    # ------------------------------------------------------------------ #
    - script: |
        # Point jf at the conda prefix so it knows what was installed
        jf curation-audit \
          --format=json \
          2>&1 | tee curation.json

        # Surface a human-readable summary in the pipeline log
        python3 - <<'EOF'
        import json, sys

        try:
            with open('curation.json') as f:
                raw = f.read().strip()
            # curation-audit may emit an array or a single object
            results = json.loads(raw) if raw.startswith('[') else [json.loads(raw)]
        except Exception as e:
            print(f"Could not parse curation.json: {e}")
            sys.exit(0)

        blocked = []
        allowed = 0
        for entry in results:
            for pkg in entry.get('blocked', []):
                blocked.append(pkg)
            allowed += len(entry.get('approved', []))

        print(f"\n{'='*60}")
        print(f" CURATION REPORT")
        print(f"{'='*60}")
        print(f"  Approved : {allowed}")
        print(f"  Blocked  : {len(blocked)}")
        if blocked:
            print()
            for pkg in blocked:
                print(f"  ✗ {pkg.get('name','?')}=={pkg.get('version','?')}")
                print(f"    Policy    : {pkg.get('policy_name','N/A')}")
                print(f"    Condition : {pkg.get('condition_name','N/A')}")
                print(f"    Reason    : {pkg.get('explanation','N/A')}")
                print()
        print(f"{'='*60}\n")

        # Step 5 already failed the pipeline if anything was blocked.
        # This script is purely informational — always exits 0.
        EOF
      displayName: Publish curation audit report
      condition: always()

    # ------------------------------------------------------------------ #
    # 7. Publish curation artefact for compliance trail                   #
    # ------------------------------------------------------------------ #
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: curation.json
        artifactName: CurationResults
      displayName: Publish curation JSON
      condition: always()


# ------------------------------------------------------------------ #
# GitHub mirror — unchanged                                           #
# ------------------------------------------------------------------ #
- stage: Github
  displayName: Publish to GitHub
  dependsOn:
    - Curation
  condition: and(
    succeeded('Curation'),
    eq(variables.isMain, true) )
  jobs:
    - job: Mirror
      displayName: Mirror to GitHub
      pool:
        vmImage: ubuntu-latest

      steps:
      - checkout: self
        fetchDepth: 0

      - script: |
          git remote remove github 2>/dev/null || true
          git remote add github https://$(github_author_token)@github.com/$(github_org)/$(github_repo_name).git
          git push github HEAD:refs/heads/"$BUILD_SOURCEBRANCHNAME" --follow-tags
        displayName: Push mirror to GitHub
