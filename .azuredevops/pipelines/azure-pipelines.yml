trigger:
  batch: true
  branches:
    include:
    - '*'

variables:
  - group: gswa-jfrog
  - group: nickel-prospectivity-maps
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: MAMBA_ROOT_PREFIX
    value: $(Agent.TempDirectory)/micromamba
  - name: CACHE_VERSION
    value: 'v1'
  - name: JFROG_PLATFORM_CONNECTION
    value: 'service-ado-gsrsd-platform'
  - name: BUILD_NAME
    value: $(Build.DefinitionName)
  - name: BUILD_NUMBER
    value: $(Build.BuildNumber)

pool:
  vmImage: ubuntu-latest

stages:
- stage: Curation
  displayName: Curation Scan
  jobs:
  - job: CurationAudit
    steps:

    # ------------------------------------------------------------------ #
    # 1. JFrog CLI                                                         #
    # ------------------------------------------------------------------ #
    - task: JfrogCliV2@1
      displayName: Install JFrog CLI
      inputs:
        jfrogPlatformConnection: $(JFROG_PLATFORM_CONNECTION)
        command: 'jf --version'

    # ------------------------------------------------------------------ #
    # 2. micromamba                                                        #
    # ------------------------------------------------------------------ #
    - script: |
        curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
          | tar -xvj bin/micromamba
        echo "##vso[task.prependpath]$(pwd)/bin"
      displayName: Install micromamba

    # ------------------------------------------------------------------ #
    # 3. Generate environment-scan.yml                                    #
    # ------------------------------------------------------------------ #
    - script: |
        python3 - <<'EOF'
        import yaml, os

        SKIP = {
          'vc', 'vs2015_runtime', 'win_inet_pton', 'wincertstore', 'winkerberos',
          'winpty', 'pywin32-ctypes', 'pywin32-security', 'pywinpty',
          'requests-negotiate-sspi', 'icc_rt', 'x86cpu', 'python-certifi-win32',
          'python_abi', 'arcgis', 'arcgispro', 'arcpy', 'arcpy-base',
          'pro_notebook_integration', 'despatch',
        }

        with open('environment.yml') as f:
            env = yaml.safe_load(f)

        seen, lines = set(), []
        for dep in env.get('dependencies', []):
            if not isinstance(dep, str):
                continue
            parts = dep.split('=')
            name, version = parts[0].strip(), (parts[1].strip() if len(parts) >= 2 else None)
            if name.lower() in SKIP or name.lower() in seen:
                continue
            seen.add(name.lower())
            lines.append(f"{name}={version}" if version else name)

        url  = os.environ['JFROG_URL'].rstrip('/')
        repo = os.environ['ARTIFACTORY_CONDA_REPO']
        with open('environment-scan.yml', 'w') as f:
            f.write(f"name: scan-env\nchannels:\n  - {url}/artifactory/api/conda/{repo}\ndependencies:\n")
            f.writelines(f"  - {l}\n" for l in lines)
        print(f"Written {len(lines)} packages")
        EOF
      displayName: Generate environment-scan.yml
      env:
        JFROG_URL: $(jfrog_url)
        ARTIFACTORY_CONDA_REPO: $(artifactory_conda_repo)

    # ------------------------------------------------------------------ #
    # 4. Restore conda cache                                              #
    # ------------------------------------------------------------------ #
    - task: Cache@2
      displayName: Restore conda cache
      inputs:
        key: '"conda-env" | "$(CACHE_VERSION)" | environment.yml'
        path: $(MAMBA_ROOT_PREFIX)/envs/scan-env
        cacheHitVar: CONDA_CACHE_RESTORED

    # ------------------------------------------------------------------ #
    # 5. Install via Artifactory                                          #
    #                                                                      #
    #    Auth bridged from JFrog CLI config written in step 1.           #
    # ------------------------------------------------------------------ #
    - script: |
        JFROG_HOST=$(echo "$JFROG_URL" | sed 's|https://||;s|/.*||')
        TOKEN=$(python3 -c "
        import json, os
        d = json.load(open(os.path.expanduser('~/.jfrog/jfrog-cli.conf')))
        print(d['servers'][0]['accessToken'])")
        printf "machine %s\nlogin x-jf-authorization\npassword %s\n" \
          "$JFROG_HOST" "$TOKEN" > ~/.netrc
        chmod 600 ~/.netrc
        micromamba create --name scan-env --file environment-scan.yml --override-channels --yes
      displayName: Install via Artifactory
      condition: ne(variables.CONDA_CACHE_RESTORED, 'true')
      env:
        JFROG_URL: $(jfrog_url)

    # ------------------------------------------------------------------ #
    # 6. Collect build info and publish to Artifactory                   #
    #                                                                      #
    #    Captures the resolved environment as a build in Artifactory      #
    #    so Xray can scan it in the next step.                           #
    # ------------------------------------------------------------------ #
    - task: JfrogCliV2@1
      displayName: Collect and publish build info
      inputs:
        jfrogPlatformConnection: $(JFROG_PLATFORM_CONNECTION)
        command: |
          jf rt build-collect-env $(BUILD_NAME) $(BUILD_NUMBER)
          jf rt build-publish $(BUILD_NAME) $(BUILD_NUMBER)

    # ------------------------------------------------------------------ #
    # 7. Xray build scan — SECURITY GATE                                  #
    #                                                                      #
    #    Scans the published build against your Xray watches/policies.   #
    #    Fails the pipeline if any policy is violated. Pass --fail=true  #
    #    to enforce; remove to run in notification-only mode.            #
    # ------------------------------------------------------------------ #
    - task: JfrogCliV2@1
      displayName: Xray build scan (security gate)
      inputs:
        jfrogPlatformConnection: $(JFROG_PLATFORM_CONNECTION)
        command: |
          jf bs $(BUILD_NAME) $(BUILD_NUMBER) --fail=true


- stage: Github
  displayName: Publish to GitHub
  dependsOn: Curation
  condition: and(succeeded('Curation'), eq(variables.isMain, true))
  jobs:
  - job: Mirror
    steps:
    - checkout: self
      fetchDepth: 0
    - script: |
        git remote remove github 2>/dev/null || true
        git remote add github https://$(github_author_token)@github.com/$(github_org)/$(github_repo_name).git
        git push github HEAD:refs/heads/"$BUILD_SOURCEBRANCHNAME" --follow-tags
      displayName: Push mirror to GitHub