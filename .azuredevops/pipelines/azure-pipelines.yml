trigger:
  batch: true
  branches:
    include:
    - '*'
variables:
- group: gswa-jfrog           # requires: jfrog_url, jfrog_bot_token, jfrog_bot_username, artifactory_conda_repo
- group: nickel-prospectivity-maps  # requires: github_author_token, github_org, github_repo_name
- name: isMain
  value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
- name: isRC
  value: $[contains(variables['Build.SourceBranch'], 'releases/')]
- name: isCICD
  value: $[contains(variables['Build.SourceBranch'], 'cicd')]

stages:
- stage: Xray
  displayName: Xray Scan
  jobs:
  - job: ScanEnvironment
    displayName: Scan environment.yml
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: CmdLine@2
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
      displayName: Install and Configure JFrog CLI
      inputs:
        script: |
          curl -fL https://install-cli.jfrog.io | sh
          jf config add jfrog-bot \
            --url="$JFROG_URL" \
            --access-token="$JFROG_ACCESS_TOKEN" \
            --interactive=false

    - task: CmdLine@2
      env:
        JFROG_URL: $(jfrog_url)
        JFROG_ACCESS_TOKEN: $(jfrog_bot_token)
        JFROG_BOT_USERNAME: $(jfrog_bot_username)
        JFROG_CONDA_REPO: $(artifactory_conda_repo)
      displayName: Install Miniconda and configure JFrog conda channel
      inputs:
        script: |
          wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p "$HOME/miniconda"
          export PATH="$HOME/miniconda/bin:$PATH"

          conda install -n base conda-libmamba-solver -q -y
          conda config --set solver libmamba

          # Basic-Auth only accepts a reference token when paired with the exact
          # username it was issued under (jfrog_bot_username), not an arbitrary
          # label. Embed it in the channel URL, which is JFrog's documented method
          # for conda. Azure DevOps masks the literal value of jfrog_bot_token in
          # logs since it comes from a variable-group secret.
          JFROG_HOST=$(echo "$JFROG_URL" | sed 's|https\?://||' | sed 's|/.*||')
          JFROG_CHANNEL_URL="https://${JFROG_BOT_USERNAME}:${JFROG_ACCESS_TOKEN}@${JFROG_HOST}/artifactory/$JFROG_CONDA_REPO"

          # Replace upstream channels with the JFrog conda virtual repo. Write
          # .condarc directly rather than `conda config --add/--remove` — the
          # implicit 'defaults' fallback isn't actually present as a literal
          # entry to remove, so `--remove channels defaults` silently no-ops
          # and 'defaults' keeps leaking back in. Packages fetched through this
          # channel are cached in Artifactory and automatically indexed by
          # Xray, which populates results in the JFrog UI.
          # NOTE: your conda virtual repo must proxy both 'defaults' and 'esri' channels.
          {
            echo "channels:"
            echo "  - $JFROG_CHANNEL_URL"
            echo "channel_priority: strict"
          } > "$HOME/.condarc"
          chmod 600 "$HOME/.condarc"

    - task: CmdLine@2
      displayName: Parse environment.yml
      inputs:
        script: |
          python3 - <<'PYEOF'
          import yaml

          # Packages with no linux-64 build — Windows / ArcGIS Pro runtime only.
          # Fetched via the win-64 conda subdir instead (see download step) so
          # Xray still gets a real binary to fingerprint.
          WINDOWS_ONLY = {
              'arcgis', 'arcgispro', 'arcpy', 'arcpy-base', 'pro_notebook_integration',
              'icc_rt', 'vc', 'vs2015_runtime',
              'pywin32-ctypes', 'pywin32-security', 'pywinpty',
              'win_inet_pton', 'wincertstore', 'winkerberos', 'winpty',
              'python-certifi-win32',
          }

          with open('environment.yml') as f:
              env = yaml.safe_load(f)

          cross_platform = []
          windows_only = []

          for dep in env.get('dependencies', []):
              if not isinstance(dep, str):
                  continue  # skip pip: sub-blocks
              parts = dep.split('=')
              name = parts[0]
              # Strip platform-specific build string: keep name=version only.
              # Also handles trailing-equals edge cases like 'pyarrow=1.0.1='.
              version = parts[1] if len(parts) >= 2 and parts[1] else None
              spec = f"{name}={version}" if version else name

              (windows_only if name in WINDOWS_ONLY else cross_platform).append(spec)

          with open('cross_platform_pkgs.txt', 'w') as f:
              f.write('\n'.join(cross_platform))

          with open('windows_pkgs.txt', 'w') as f:
              f.write('\n'.join(windows_only))

          print(f"Cross-platform packages: {len(cross_platform)}")
          print(f"Windows-only packages (win-64 subdir): {len(windows_only)}")
          PYEOF

    - task: CmdLine@2
      displayName: Download packages via JFrog conda channel
      inputs:
        script: |
          export PATH="$HOME/miniconda/bin:$PATH"
          mkdir -p conda-pkgs

          # The Miniconda bootstrap + libmamba-solver install (previous step) already
          # left their own packages in the local cache (anaconda-auth, conda-rattler-solver,
          # etc.). Clear it so the find below only picks up what we request here.
          rm -rf "$HOME/miniconda/pkgs"/*

          # `conda install --download-only --prefix` requires an already-initialized
          # conda environment at that prefix, or it fails with EnvironmentLocationNotFound.
          conda create --prefix /tmp/scan-prefix --yes

          download() {
            local pkgfile=$1
            local pkgs
            pkgs=$(tr '\n' ' ' < "$pkgfile")
            [ -z "$pkgs" ] && return 0
            echo "Downloading $(wc -w < "$pkgfile") packages (CONDA_SUBDIR=${CONDA_SUBDIR:-native}) through JFrog..."
            # Channels are already configured to point to JFrog (see setup step above).
            # Do not use --override-channels here or it will ignore the JFrog channel config.
            # environment.yml is a full `conda env export`, so every transitive
            # dependency is already pinned explicitly — there's nothing left to
            # solve. --no-deps skips the dependency-graph solve entirely, which
            # is what was blowing past the hosted agent's memory limit.
            conda install \
              --download-only \
              --no-deps \
              --prefix /tmp/scan-prefix \
              --yes \
              $pkgs 2>&1 | tail -30 || true
          }

          download cross_platform_pkgs.txt

          # Windows/ArcGIS-only packages have no linux-64 build; force the win-64
          # subdir so conda fetches a real Windows binary instead. --download-only
          # never links or executes it, so this is safe from the Ubuntu agent.
          CONDA_SUBDIR=win-64 download windows_pkgs.txt

          find "$HOME/miniconda/pkgs" \( -name "*.conda" -o -name "*.tar.bz2" \) \
            -exec cp {} conda-pkgs/ \;

          echo "Downloaded $(ls conda-pkgs | wc -l) packages to conda-pkgs/"

    - task: CmdLine@2
      displayName: Scan downloaded packages with Xray
      inputs:
        script: |
          # Produces SARIF for the Azure DevOps Code Analysis Logs tab.
          # Full vulnerability results are also visible in the JFrog UI because packages
          # were fetched through Artifactory above and Xray indexes them automatically.
          #
          # --watches applies the gsrsd_watch policy (and its ignore rules/exceptions),
          # so this only fails the build on violations that aren't already excepted.
          set +e
          jf scan conda-pkgs/ \
            --server-id=jfrog-bot \
            --watches=gsrsd_watch \
            --format=sarif > xray.sarif
          sarif_rc=$?

          jf scan conda-pkgs/ \
            --server-id=jfrog-bot \
            --watches=gsrsd_watch \
            --format=json > xray.json
          json_rc=$?
          set -e

          if [ "$sarif_rc" -ne 0 ] || [ "$json_rc" -ne 0 ]; then
            echo "Xray reported violations against watch 'gsrsd_watch' not covered by an existing exception."
            exit 1
          fi

    - task: PublishPipelineArtifact@1
      displayName: Publish SARIF Results
      condition: always()
      inputs:
        targetPath: xray.sarif
        artifactName: CodeAnalysisLogs

    - task: PublishPipelineArtifact@1
      displayName: Publish JSON Results
      condition: always()
      inputs:
        targetPath: xray.json
        artifactName: XrayJsonResults

- stage: Github
  displayName: 'Publish to GitHub'
  dependsOn:
  - Xray
  condition: and( succeeded('Xray'), eq(variables.isMain, true) )
  jobs:
  - job: Mirror
    displayName: 'Mirror to GitHub'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        fetchDepth: 0
    - task: CmdLine@2
      displayName: 'Push Mirror to GitHub'
      inputs:
        script: |
          git remote remove github 2>/dev/null || true
          git remote add github https://$(github_author_token)@github.com/$(github_org)/$(github_repo_name).git
          git push github HEAD:refs/heads/"$BUILD_SOURCEBRANCHNAME" --follow-tags
